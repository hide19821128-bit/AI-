

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>AI RACE V3</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:18px;background:#101923;color:white;font-family:-apple-system,sans-serif}

h1{color:#65dfba;margin-bottom:4px}

p,small{color:#aab9cb}

.card{background:#1e2c3b;border-radius:16px;padding:16px;margin:16px 0}

button,input,select,textarea{font-size:16px;border:0;border-radius:10px;padding:12px}

button{width:100%;background:#65dfba;color:#10251e;font-weight:bold;margin:6px 0}

button:disabled{opacity:.5}

input,select,textarea{width:100%;background:#304154;color:white;margin:6px 0}

input[type=checkbox]{width:24px;height:24px;accent-color:#65dfba}

.tabs{display:flex;gap:10px}

.tabs button{background:#304154;color:white}

.tabs .active{background:#65dfba;color:#10251e}

table{width:100%;border-collapse:collapse;text-align:center;font-size:13px}

td,th{padding:10px 4px;border-bottom:1px solid #405063}

details{background:#29394b;border-radius:12px;padding:14px;margin:10px 0}

summary{font-weight:bold;cursor:pointer}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.stat{background:#29394b;padding:14px;border-radius:12px}

.stat strong{display:block;font-size:24px;margin-top:8px}

.warn{color:#ffd08a}

.good{color:#65dfba}

a{color:#65dfba}

.scroll{overflow-x:auto}

.num{display:inline-block;border-radius:5px;padding:6px 10px;font-weight:bold}

</style>

</head>

<body>

<h1>AI RACE <small>V3</small></h1>

<p>競馬・競艇 データ分析</p>

<div class="card">

<div class="tabs">

<button id="boat" onclick="change('boat')">競艇</button>

<button id="horse" onclick="change('horse')">競馬</button>

</div>

<label>開催日</label>

<input type="date" id="date">

<label>レース名を直接入力</label>

<input id="direct" placeholder="大村10R、東京11R">

<button onclick="directSearch()">レースを選択</button>

<label>開催場</label>

<select id="venue"></select>

<label>レース番号</label>

<select id="race"></select>

<button id="load" onclick="analyse()">レースデータ取得</button>

</div>

<div id="result" hidden>

<div class="card">

<h2 id="raceTitle"></h2>

<p id="status" role="status"></p>

<p id="deadline"></p>

<a id="official" target="_blank" rel="noopener">公式レース情報</a>

</div>

<div class="card">

<h3>出走選手・成績</h3>

<div class="scroll">

<table id="racers"></table>

</div>

<p id="source"></p>

</div>

<div class="card">

<h3>選手別詳細データ</h3>

<div id="details"></div>

</div>

<div class="card">

<h3>分析状況</h3>

<table id="factors"></table>

<p class="warn">AI予測モデルは未接続です。</p>

<textarea id="notes" rows="4" placeholder="分析メモ"></textarea>

</div>

<div class="card">

<h3>着順別確率</h3>

<p>検証済みの確率を手動入力できます。</p>

<label>出走数</label>

<select id="field" onchange="buildTables()"></select>

<table id="rates"></table>

</div>

<div class="card">

<h3>仮想収支検証</h3>

<select id="method" onchange="calculate()">

<option value="triple">3連単</option>

<option value="trio">3連複</option>

</select>

<details>

<summary>チェック表を表示</summary>

<table id="checks"></table>

</details>

<div class="stats">

<div class="stat">点数<strong id="points">0</strong></div>

<div class="stat">仮想購入額<strong id="cost">0円</strong></div>

</div>

<label>1点あたりの仮想金額</label>

<input id="stake" type="number" min="100" step="100" value="100" oninput="calculate()">

<label>仮想払戻額</label>

<input id="payout" type="number" min="0" value="0">

<button onclick="save()">仮想成績を保存</button>

</div>

</div>

<div class="card">

<h3>累計成績</h3>

<div class="stats">

<div class="stat">記録数<strong id="count">0</strong></div>

<div class="stat">的中率<strong id="hit">0%</strong></div>

<div class="stat">回収率<strong id="roi">0%</strong></div>

<div class="stat">累計収支<strong id="profit">0円</strong></div>

</div>

<details>

<summary>分析履歴</summary>

<div id="history"></div>

</details>

</div>

<script>

const $=id=>document.getElementById(id);

const venues={

boat:'桐生 戸田 江戸川 平和島 多摩川 浜名湖 蒲郡 常滑 津 三国 びわこ 住之江 尼崎 鳴門 丸亀 児島 宮島 徳山 下関 若松 芦屋 福岡 唐津 大村',

horse:'札幌 函館 福島 新潟 東京 中山 中京 京都 阪神 小倉'

};

const colors=['#eeeeee','#333333','#df4444','#3478cf','#e4c22b','#26965b'];

let sport='boat',points=0,requestId=0,currentRace=null;

let records=[];

try{records=JSON.parse(localStorage.getItem('raceRecords')||'[]')}catch(e){}

$('date').value=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});

$('race').innerHTML=Array.from({length:12},(_,i)=>`<option>${i+1}R</option>`).join('');

function esc(v){

return String(v??'―').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

}

function change(s){

requestId++;

currentRace=null;

sport=s;

$('load').disabled=false;

$('boat').className=s==='boat'?'active':'';

$('horse').className=s==='horse'?'active':'';

$('venue').innerHTML=venues[s].split(' ').map(v=>`<option>${v}</option>`).join('');

$('result').hidden=true;

}

function directSearch(){

let t=$('direct').value.normalize('NFKC').replace(/\s/g,'');

let m=t.match(/^(.+?)([1-9]|1[0-2])R$/i);

if(!m){alert('大村10Rのように入力してください');return}

let s=Object.keys(venues).find(k=>venues[k].split(' ').includes(m[1]));

if(!s){alert('開催場を確認してください');return}

change(s);

$('venue').value=m[1];

$('race').value=m[2]+'R';

analyse();

}

async function analyse(){

const date=$('date').value;

if(!date){alert('開催日を選択してください');return}

const id=++requestId;

const mode=sport;

const venue=$('venue').value;

const race=parseInt($('race').value);

const day=date.replace(/-/g,'');

const stadium=venues.boat.split(' ').indexOf(venue)+1;

currentRace={date,race:venue+race+'R'};

$('result').hidden=false;

$('raceTitle').textContent=currentRace.race;

$('status').textContent='データ取得中...';

$('deadline').textContent=date;

$('racers').innerHTML='';

$('details').innerHTML='';

$('source').textContent='';

$('notes').value='';

$('payout').value=0;

$('field').innerHTML=mode==='boat'?'<option>6</option>':Array.from({length:16},(_,i)=>`<option>${i+3}</option>`).join('');

$('field').value=mode==='boat'?'6':'18';

buildTables();

setFactors(false);

$('official').href=mode==='boat'?

`https://www.boatrace.jp/owpc/pc/race/racelist?rno=${race}&jcd=${String(stadium).padStart(2,'0')}&hd=${day}`:

'https://www.jra.go.jp/';

if(mode==='horse'){

$('status').textContent='競馬データは未接続です。';

return;

}

$('load').disabled=true;

try{

const url=`https://boatraceopenapi.github.io/api/v1/${day.slice(0,4)}/${day}.json`;

const res=await fetch(url,{cache:'no-store'});

if(!res.ok)throw new Error('HTTP '+res.status);

const data=await res.json();

if(id!==requestId)return;

const r=data.programs?.stadiums?.[stadium]?.races?.[race];

if(!r||!r.racers)throw new Error('指定日のレース情報がありません');

$('status').textContent='出走表データ取得成功';

$('status').className='good';

$('deadline').textContent='締切：'+(r.closed_at||'未取得');

const racers=Object.values(r.racers).sort((a,b)=>a.entry_number-b.entry_number);

$('racers').innerHTML='<tr><th>艇</th><th>選手</th><th>級</th><th>全国勝率</th><th>平均ST</th><th>機力2連率</th></tr>'+

racers.map(x=>`<tr>

<td><span class="num" style="background:${colors[x.entry_number-1]||'#555'};color:${[1,5].includes(x.entry_number)?'#111':'white'}">${esc(x.entry_number)}</span></td>

<td>${esc(x.name)}</td>

<td>${esc(x.rank_number_source)}</td>

<td>${esc(x.national_win_rate)}</td>

<td>${esc(x.average_start_timing)}</td>

<td>${esc(x.motor_top_2_percent)}</td>

</tr>`).join('');

$('details').innerHTML=racers.map(x=>`

<details>

<summary>${esc(x.entry_number)}号艇 ${esc(x.name)}</summary>

<table>

<tr><td>登録番号</td><td>${esc(x.number)}</td></tr>

<tr><td>級別</td><td>${esc(x.rank_number_source)}</td></tr>

<tr><td>体重</td><td>${esc(x.weight)} kg</td></tr>

<tr><td>全国勝率</td><td>${esc(x.national_win_rate)}</td></tr>

<tr><td>全国2連対率</td><td>${esc(x.national_top_2_percent)}%</td></tr>

<tr><td>全国3連対率</td><td>${esc(x.national_top_3_percent)}%</td></tr>

<tr><td>当地勝率</td><td>${esc(x.local_win_rate)}</td></tr>

<tr><td>当地2連対率</td><td>${esc(x.local_top_2_percent)}%</td></tr>

<tr><td>当地3連対率</td><td>${esc(x.local_top_3_percent)}%</td></tr>

<tr><td>平均ST</td><td>${esc(x.average_start_timing)}</td></tr>

<tr><td>F回数</td><td>${esc(x.flying_count)}</td></tr>

<tr><td>モーター番号</td><td>${esc(x.motor_number)}</td></tr>

<tr><td>モーター2連率</td><td>${esc(x.motor_top_2_percent)}%</td></tr>

<tr><td>モーター3連率</td><td>${esc(x.motor_top_3_percent)}%</td></tr>

</table>

</details>`).join('');

$('source').textContent='出典：Boatrace Open API（非公式）／取得時刻：'+new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'});

setFactors(true);

}catch(e){

if(id===requestId){

$('status').textContent='取得失敗：'+e.message;

$('status').className='warn';

}

}finally{

if(id===requestId)$('load').disabled=false;

}

}

function setFactors(ok){

let f=sport==='boat'?

['選手成績','級別','全国・当地勝率','モーター','平均ST','フライング歴','コース別着順率','展示タイム','水質・潮位','風速・波高','オッズ']:

['競走馬成績','騎手','距離適性','枠順','馬場状態','調教','馬体重','展開','オッズ'];

$('factors').innerHTML=f.map((x,i)=>`<tr><td>${x}</td><td class="${ok&&i<6?'good':'warn'}">${ok&&i<6?'取得済み':'未取得'}</td></tr>`).join('');

}

function buildTables(){

let n=Number($('field').value);

$('rates').innerHTML='<tr><th>番号</th><th>1着%</th><th>2着%</th><th>3着%</th></tr>'+

Array.from({length:n},(_,i)=>`<tr><td>${i+1}</td>${Array.from({length:3},()=>'<td><input type="number" min="0" max="100" placeholder="―"></td>').join('')}</tr>`).join('');

$('checks').innerHTML='<tr><th>番号</th><th>1列目</th><th>2列目</th><th>3列目</th></tr>'+

Array.from({length:n},(_,i)=>`<tr><td>${i+1}</td>${[0,1,2].map(j=>`<td><input type="checkbox" data-num="${i+1}" data-col="${j}" onchange="calculate()"></td>`).join('')}</tr>`).join('');

calculate();

}

function calculate(){

let c=[0,1,2].map(j=>Array.from(document.querySelectorAll(`#checks input[data-col="${j}"]:checked`)).map(e=>Number(e.dataset.num)));

let set=new Set();

for(let a of c[0])for(let b of c[1])for(let d of c[2]){

if(new Set([a,b,d]).size!==3)continue;

let arr=[a,b,d];

if($('method').value==='trio')arr.sort((x,y)=>x-y);

set.add(arr.join('-'));

}

points=set.size;

$('points').textContent=points+'点';

$('cost').textContent=(points*Number($('stake').value||0)).toLocaleString()+'円';

}

function save(){

let stake=Number($('stake').value),payout=Number($('payout').value);

let cost=points*stake;

if(!currentRace||!points||!Number.isFinite(cost)||stake<100||stake%100!==0||!Number.isFinite(payout)||payout<0){

alert('チェック表と金額を確認してください');return;

}

records.push({...currentRace,cost,payout,notes:$('notes').value});

try{

localStorage.setItem('raceRecords',JSON.stringify(records));

}catch(e){

records.pop();

alert('保存できませんでした');return;

}

update();

alert('仮想成績を保存しました');

}

function update(){

let cost=records.reduce((s,r)=>s+Number(r.cost),0);

let pay=records.reduce((s,r)=>s+Number(r.payout),0);

$('count').textContent=records.length;

$('hit').textContent=records.length?(records.filter(r=>r.payout>0).length/records.length*100).toFixed(1)+'%':'0%';

$('roi').textContent=cost?(pay/cost*100).toFixed(1)+'%':'0%';

$('profit').textContent=(pay-cost).toLocaleString()+'円';

$('history').replaceChildren();

records.slice().reverse().forEach(r=>{

let p=document.createElement('p');

p.textContent=(r.date||'')+' '+r.race+'：'+(r.payout-r.cost).toLocaleString()+'円';

$('history').appendChild(p);

});

}

change('boat');

update();

</script>

</body>

</html>
<script>

const originalAnalyse = analyse;

analyse = async function(){

 const mode = sport;

 const day = $('date').value.replace(/-/g,'');

 const stadium = venues.boat.split(' ').indexOf($('venue').value)+1;

 const race = parseInt($('race').value);

 document.getElementById('extraV4')?.remove();

 await originalAnalyse();

 if(mode!=='boat'||sport!==mode)return;

 if($('date').value.replace(/-/g,'')!==day)return;

 if(venues.boat.split(' ').indexOf($('venue').value)+1!==stadium)return;

 if(parseInt($('race').value)!==race)return;

 const box=document.createElement('div');

 box.id='extraV4';

 box.className='card';

 box.textContent='展示・結果データ取得中...';

 $('details').parentElement.after(box);

 try{

 const url=`https://boatraceopenapi.github.io/api/v1/${day.slice(0,4)}/${day}.json`;

 const res=await fetch(url,{cache:'no-store'});

 if(!res.ok)throw new Error('HTTP '+res.status);

 const data=await res.json();

 const r=data.programs?.stadiums?.[stadium]?.races?.[race];

 if(!r)throw new Error('レース情報なし');

 const p=r.preview||{};

 const result=r.result||{};

 const value=(x)=>esc(x??'未取得');

 box.innerHTML=`

 <h3>直前情報・展示</h3>

 <table>

 <tr><td>天候</td><td>${value(p.weather_number_source)}</td></tr>

 <tr><td>風向</td><td>${value(p.wind_direction_number_source)}</td></tr>

 <tr><td>風速(m)</td><td>${value(p.wind_speed)}</td></tr>

 <tr><td>波高(cm)</td><td>${value(p.wave_height)}</td></tr>

 <tr><td>気温(℃)</td><td>${value(p.air_temperature)}</td></tr>

 <tr><td>水温(℃)</td><td>${value(p.water_temperature)}</td></tr>

 </table>

 <h3>展示成績</h3>

 <div class="scroll">

 <table>

 <tr><th>艇</th><th>進入</th><th>展示ST</th><th>タイム</th><th>チルト</th></tr>

 ${[1,2,3,4,5,6].map(n=>{

 const x=p.racers?.[n]||{};

 return `<tr>

 <td>${n}</td>

 <td>${value(x.course_number)}</td>

 <td>${value(x.start_timing_source??x.start_timing)}</td>

 <td>${value(x.exhibition_time)}</td>

 <td>${value(x.tilt_adjustment)}</td>

 </tr>`;

 }).join('')}

 </table>

 </div>

 <details>

 <summary>確定レース結果・払戻金</summary>

 <table>

 <tr><th>着順</th><th>艇</th><th>選手名</th></tr>

 ${Object.values(result.racers||{})

 .filter(x=>x.place_number>=1&&x.place_number<=6)

 .sort((a,b)=>a.place_number-b.place_number)

 .map(x=>`<tr><td>${value(x.place_number)}</td><td>${value(x.entry_number)}</td><td>${value(x.name)}</td></tr>`).join('')}

 </table>

 <h4>3連単</h4>

 ${showPayout(result.payouts?.trifecta)}

 <h4>3連複</h4>

 ${showPayout(result.payouts?.trio)}

 <p>備考：${value(result.remarks)}</p>

 <p>返還艇：${Array.isArray(result.refunds)?esc(result.refunds.join('・')||'なし'):'未取得'}</p>

 </details>

 <p class="warn">非公式データ・最新情報に遅れがある場合があります。</p>`;

 }catch(e){

 box.textContent='追加情報の取得失敗：'+e.message;

 }

};

function showPayout(items){

 if(!Array.isArray(items)||!items.length){

 return '<p>結果未取得</p>';

 }

 return items.map(x=>`<p>${esc(x.combination)}：${x.amount==null?esc(x.label??'未取得'):Number(x.amount).toLocaleString()+'円'}</p>`).join('');

}

document.querySelector('h1 small').textContent='V4';

document.title='AI RACE V4';

</script>
<script>

analyse = async function(){

 const mode=sport;

 const day=$('date').value.replace(/-/g,'');

 const stadium=venues.boat.split(' ').indexOf($('venue').value)+1;

 const race=parseInt($('race').value);

 document.getElementById('extraV4')?.remove();

 await originalAnalyse();

 if(mode!=='boat'||sport!==mode)return;

 if($('date').value.replace(/-/g,'')!==day)return;

 if(venues.boat.split(' ').indexOf($('venue').value)+1!==stadium)return;

 if(parseInt($('race').value)!==race)return;

 const box=document.createElement('div');

 box.id='extraV4';

 box.className='card';

 box.textContent='直前情報・結果取得中...';

 $('details').parentElement.after(box);

 const base='https://boatraceopenapi.github.io/';

 const path=day.slice(0,4)+'/'+day+'.json';

 async function get(path){

  try{

   const res=await fetch(base+path,{cache:'no-store'});

   if(!res.ok)return null;

   return await res.json();

  }catch(e){return null}

 }

 const [pd,rd]=await Promise.all([

 get('previews/v2/'+path),

 get('results/v3/'+path)

 ]);

 if(!box.isConnected)return;

 const p=pd?.previews?.find(x=>

 Number(x.race_stadium_number)===stadium&&

 Number(x.race_number)===race);

 const r=rd?.results?.find(x=>

 Number(x.stadium_number)===stadium&&

 Number(x.number)===race);

 const val=x=>esc(x??'未取得');

 function st(x){

  if(x==null)return '未取得';

  if(Number(x)<0)return 'F'+Math.abs(Number(x)).toFixed(2);

  return Number(x).toFixed(2);

 }

 function payout(items){

  if(!Array.isArray(items)||!items.length)

   return '<p>結果未取得</p>';

  return items.map(x=>'<p>'+val(x.combination)+'：'+val(x.amount==null?null:Number(x.amount).toLocaleString())+'円</p>').join('');

 }

 box.innerHTML=`

 <h3>直前情報・水面条件</h3>

 <p class="${p?'good':'warn'}">${p?'展示データ取得成功':'展示データ未取得'}</p>

 <table>

 <tr><td>天候コード</td><td>${val(p?.race_weather_number)}</td></tr>

 <tr><td>風向コード</td><td>${val(p?.race_wind_direction_number)}</td></tr>

 <tr><td>風速</td><td>${val(p?.race_wind)} m</td></tr>

 <tr><td>波高</td><td>${val(p?.race_wave)} cm</td></tr>

 <tr><td>気温</td><td>${val(p?.race_temperature)} ℃</td></tr>

 <tr><td>水温</td><td>${val(p?.race_water_temperature)} ℃</td></tr>

 </table>

 <h3>展示成績</h3>

 <div class="scroll">

 <table>

 <tr>

 <th>艇</th><th>進入</th><th>展示ST</th><th>タイム</th><th>チルト</th>

 </tr>

 ${[1,2,3,4,5,6].map(n=>{

 const x=p?.boats?.find(b=>Number(b.racer_boat_number)===n);

 return `<tr>

 <td><span class="num" style="background:${colors[n-1]};color:${[1,5].includes(n)?'#111':'white'}">${n}</span></td>

 <td>${val(x?.racer_course_number)}</td>

 <td>${st(x?.racer_start_timing)}</td>

 <td>${val(x?.racer_exhibition_time)}</td>

 <td>${val(x?.racer_tilt_adjustment)}</td>

 </tr>`;

 }).join('')}

 </table>

 </div>

 <details>

 <summary>確定レース結果・払戻金</summary>

 <p class="${r?'good':'warn'}">${r?'結果取得成功':'結果未取得'}</p>

 <table>

 <tr><th>着順</th><th>艇番</th><th>選手名</th></tr>

 ${(r?.boats||[]).slice().sort((a,b)=>

 Number(a.racer_place_number)-Number(b.racer_place_number)

 ).map(x=>`<tr>



<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>AI RACE V3</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:18px;background:#101923;color:white;font-family:-apple-system,sans-serif}

h1{color:#65dfba;margin-bottom:4px}

p,small{color:#aab9cb}

.card{background:#1e2c3b;border-radius:16px;padding:16px;margin:16px 0}

button,input,select,textarea{font-size:16px;border:0;border-radius:10px;padding:12px}

button{width:100%;background:#65dfba;color:#10251e;font-weight:bold;margin:6px 0}

button:disabled{opacity:.5}

input,select,textarea{width:100%;background:#304154;color:white;margin:6px 0}

input[type=checkbox]{width:24px;height:24px;accent-color:#65dfba}

.tabs{display:flex;gap:10px}

.tabs button{background:#304154;color:white}

.tabs .active{background:#65dfba;color:#10251e}

table{width:100%;border-collapse:collapse;text-align:center;font-size:13px}

td,th{padding:10px 4px;border-bottom:1px solid #405063}

details{background:#29394b;border-radius:12px;padding:14px;margin:10px 0}

summary{font-weight:bold;cursor:pointer}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.stat{background:#29394b;padding:14px;border-radius:12px}

.stat strong{display:block;font-size:24px;margin-top:8px}

.warn{color:#ffd08a}

.good{color:#65dfba}

a{color:#65dfba}

.scroll{overflow-x:auto}

.num{display:inline-block;border-radius:5px;padding:6px 10px;font-weight:bold}

</style>

</head>

<body>

<h1>AI RACE <small>V3</small></h1>

<p>競馬・競艇 データ分析</p>

<div class="card">

<div class="tabs">

<button id="boat" onclick="change('boat')">競艇</button>

<button id="horse" onclick="change('horse')">競馬</button>

</div>

<label>開催日</label>

<input type="date" id="date">

<label>レース名を直接入力</label>

<input id="direct" placeholder="大村10R、東京11R">

<button onclick="directSearch()">レースを選択</button>

<label>開催場</label>

<select id="venue"></select>

<label>レース番号</label>

<select id="race"></select>

<button id="load" onclick="analyse()">レースデータ取得</button>

</div>

<div id="result" hidden>

<div class="card">

<h2 id="raceTitle"></h2>

<p id="status" role="status"></p>

<p id="deadline"></p>

<a id="official" target="_blank" rel="noopener">公式レース情報</a>

</div>

<div class="card">

<h3>出走選手・成績</h3>

<div class="scroll">

<table id="racers"></table>

</div>

<p id="source"></p>

</div>

<div class="card">

<h3>選手別詳細データ</h3>

<div id="details"></div>

</div>

<div class="card">

<h3>分析状況</h3>

<table id="factors"></table>

<p class="warn">AI予測モデルは未接続です。</p>

<textarea id="notes" rows="4" placeholder="分析メモ"></textarea>

</div>

<div class="card">

<h3>着順別確率</h3>

<p>検証済みの確率を手動入力できます。</p>

<label>出走数</label>

<select id="field" onchange="buildTables()"></select>

<table id="rates"></table>

</div>

<div class="card">

<h3>仮想収支検証</h3>

<select id="method" onchange="calculate()">

<option value="triple">3連単</option>

<option value="trio">3連複</option>

</select>

<details>

<summary>チェック表を表示</summary>

<table id="checks"></table>

</details>

<div class="stats">

<div class="stat">点数<strong id="points">0</strong></div>

<div class="stat">仮想購入額<strong id="cost">0円</strong></div>

</div>

<label>1点あたりの仮想金額</label>

<input id="stake" type="number" min="100" step="100" value="100" oninput="calculate()">

<label>仮想払戻額</label>

<input id="payout" type="number" min="0" value="0">

<button onclick="save()">仮想成績を保存</button>

</div>

</div>

<div class="card">

<h3>累計成績</h3>

<div class="stats">

<div class="stat">記録数<strong id="count">0</strong></div>

<div class="stat">的中率<strong id="hit">0%</strong></div>

<div class="stat">回収率<strong id="roi">0%</strong></div>

<div class="stat">累計収支<strong id="profit">0円</strong></div>

</div>

<details>

<summary>分析履歴</summary>

<div id="history"></div>

</details>

</div>

<script>

const $=id=>document.getElementById(id);

const venues={

boat:'桐生 戸田 江戸川 平和島 多摩川 浜名湖 蒲郡 常滑 津 三国 びわこ 住之江 尼崎 鳴門 丸亀 児島 宮島 徳山 下関 若松 芦屋 福岡 唐津 大村',

horse:'札幌 函館 福島 新潟 東京 中山 中京 京都 阪神 小倉'

};

const colors=['#eeeeee','#333333','#df4444','#3478cf','#e4c22b','#26965b'];

let sport='boat',points=0,requestId=0,currentRace=null;

let records=[];

try{records=JSON.parse(localStorage.getItem('raceRecords')||'[]')}catch(e){}

$('date').value=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});

$('race').innerHTML=Array.from({length:12},(_,i)=>`<option>${i+1}R</option>`).join('');

function esc(v){

return String(v??'―').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

}

function change(s){

requestId++;

currentRace=null;

sport=s;

$('load').disabled=false;

$('boat').className=s==='boat'?'active':'';

$('horse').className=s==='horse'?'active':'';

$('venue').innerHTML=venues[s].split(' ').map(v=>`<option>${v}</option>`).join('');

$('result').hidden=true;

}

function directSearch(){

let t=$('direct').value.normalize('NFKC').replace(/\s/g,'');

let m=t.match(/^(.+?)([1-9]|1[0-2])R$/i);

if(!m){alert('大村10Rのように入力してください');return}

let s=Object.keys(venues).find(k=>venues[k].split(' ').includes(m[1]));

if(!s){alert('開催場を確認してください');return}

change(s);

$('venue').value=m[1];

$('race').value=m[2]+'R';

analyse();

}

async function analyse(){

const date=$('date').value;

if(!date){alert('開催日を選択してください');return}

const id=++requestId;

const mode=sport;

const venue=$('venue').value;

const race=parseInt($('race').value);

const day=date.replace(/-/g,'');

const stadium=venues.boat.split(' ').indexOf(venue)+1;

currentRace={date,race:venue+race+'R'};

$('result').hidden=false;

$('raceTitle').textContent=currentRace.race;

$('status').textContent='データ取得中...';

$('deadline').textContent=date;

$('racers').innerHTML='';

$('details').innerHTML='';

$('source').textContent='';

$('notes').value='';

$('payout').value=0;

$('field').innerHTML=mode==='boat'?'<option>6</option>':Array.from({length:16},(_,i)=>`<option>${i+3}</option>`).join('');

$('field').value=mode==='boat'?'6':'18';

buildTables();

setFactors(false);

$('official').href=mode==='boat'?

`https://www.boatrace.jp/owpc/pc/race/racelist?rno=${race}&jcd=${String(stadium).padStart(2,'0')}&hd=${day}`:

'https://www.jra.go.jp/';

if(mode==='horse'){

$('status').textContent='競馬データは未接続です。';

return;

}

$('load').disabled=true;

try{

const url=`https://boatraceopenapi.github.io/api/v1/${day.slice(0,4)}/${day}.json`;

const res=await fetch(url,{cache:'no-store'});

if(!res.ok)throw new Error('HTTP '+res.status);

const data=await res.json();

if(id!==requestId)return;

const r=data.programs?.stadiums?.[stadium]?.races?.[race];

if(!r||!r.racers)throw new Error('指定日のレース情報がありません');

$('status').textContent='出走表データ取得成功';

$('status').className='good';

$('deadline').textContent='締切：'+(r.closed_at||'未取得');

const racers=Object.values(r.racers).sort((a,b)=>a.entry_number-b.entry_number);

$('racers').innerHTML='<tr><th>艇</th><th>選手</th><th>級</th><th>全国勝率</th><th>平均ST</th><th>機力2連率</th></tr>'+

racers.map(x=>`<tr>

<td><span class="num" style="background:${colors[x.entry_number-1]||'#555'};color:${[1,5].includes(x.entry_number)?'#111':'white'}">${esc(x.entry_number)}</span></td>

<td>${esc(x.name)}</td>

<td>${esc(x.rank_number_source)}</td>

<td>${esc(x.national_win_rate)}</td>

<td>${esc(x.average_start_timing)}</td>

<td>${esc(x.motor_top_2_percent)}</td>

</tr>`).join('');

$('details').innerHTML=racers.map(x=>`

<details>

<summary>${esc(x.entry_number)}号艇 ${esc(x.name)}</summary>

<table>

<tr><td>登録番号</td><td>${esc(x.number)}</td></tr>

<tr><td>級別</td><td>${esc(x.rank_number_source)}</td></tr>

<tr><td>体重</td><td>${esc(x.weight)} kg</td></tr>

<tr><td>全国勝率</td><td>${esc(x.national_win_rate)}</td></tr>

<tr><td>全国2連対率</td><td>${esc(x.national_top_2_percent)}%</td></tr>

<tr><td>全国3連対率</td><td>${esc(x.national_top_3_percent)}%</td></tr>

<tr><td>当地勝率</td><td>${esc(x.local_win_rate)}</td></tr>

<tr><td>当地2連対率</td><td>${esc(x.local_top_2_percent)}%</td></tr>

<tr><td>当地3連対率</td><td>${esc(x.local_top_3_percent)}%</td></tr>

<tr><td>平均ST</td><td>${esc(x.average_start_timing)}</td></tr>

<tr><td>F回数</td><td>${esc(x.flying_count)}</td></tr>

<tr><td>モーター番号</td><td>${esc(x.motor_number)}</td></tr>

<tr><td>モーター2連率</td><td>${esc(x.motor_top_2_percent)}%</td></tr>

<tr><td>モーター3連率</td><td>${esc(x.motor_top_3_percent)}%</td></tr>

</table>

</details>`).join('');

$('source').textContent='出典：Boatrace Open API（非公式）／取得時刻：'+new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'});

setFactors(true);

}catch(e){

if(id===requestId){

$('status').textContent='取得失敗：'+e.message;

$('status').className='warn';

}

}finally{

if(id===requestId)$('load').disabled=false;

}

}

function setFactors(ok){

let f=sport==='boat'?

['選手成績','級別','全国・当地勝率','モーター','平均ST','フライング歴','コース別着順率','展示タイム','水質・潮位','風速・波高','オッズ']:

['競走馬成績','騎手','距離適性','枠順','馬場状態','調教','馬体重','展開','オッズ'];

$('factors').innerHTML=f.map((x,i)=>`<tr><td>${x}</td><td class="${ok&&i<6?'good':'warn'}">${ok&&i<6?'取得済み':'未取得'}</td></tr>`).join('');

}

function buildTables(){

let n=Number($('field').value);

$('rates').innerHTML='<tr><th>番号</th><th>1着%</th><th>2着%</th><th>3着%</th></tr>'+

Array.from({length:n},(_,i)=>`<tr><td>${i+1}</td>${Array.from({length:3},()=>'<td><input type="number" min="0" max="100" placeholder="―"></td>').join('')}</tr>`).join('');

$('checks').innerHTML='<tr><th>番号</th><th>1列目</th><th>2列目</th><th>3列目</th></tr>'+

Array.from({length:n},(_,i)=>`<tr><td>${i+1}</td>${[0,1,2].map(j=>`<td><input type="checkbox" data-num="${i+1}" data-col="${j}" onchange="calculate()"></td>`).join('')}</tr>`).join('');

calculate();

}

function calculate(){

let c=[0,1,2].map(j=>Array.from(document.querySelectorAll(`#checks input[data-col="${j}"]:checked`)).map(e=>Number(e.dataset.num)));

let set=new Set();

for(let a of c[0])for(let b of c[1])for(let d of c[2]){

if(new Set([a,b,d]).size!==3)continue;

let arr=[a,b,d];

if($('method').value==='trio')arr.sort((x,y)=>x-y);

set.add(arr.join('-'));

}

points=set.size;

$('points').textContent=points+'点';

$('cost').textContent=(points*Number($('stake').value||0)).toLocaleString()+'円';

}

function save(){

let stake=Number($('stake').value),payout=Number($('payout').value);

let cost=points*stake;

if(!currentRace||!points||!Number.isFinite(cost)||stake<100||stake%100!==0||!Number.isFinite(payout)||payout<0){

alert('チェック表と金額を確認してください');return;

}

records.push({...currentRace,cost,payout,notes:$('notes').value});

try{

localStorage.setItem('raceRecords',JSON.stringify(records));

}catch(e){

records.pop();

alert('保存できませんでした');return;

}

update();

alert('仮想成績を保存しました');

}

function update(){

let cost=records.reduce((s,r)=>s+Number(r.cost),0);

let pay=records.reduce((s,r)=>s+Number(r.payout),0);

$('count').textContent=records.length;

$('hit').textContent=records.length?(records.filter(r=>r.payout>0).length/records.length*100).toFixed(1)+'%':'0%';

$('roi').textContent=cost?(pay/cost*100).toFixed(1)+'%':'0%';

$('profit').textContent=(pay-cost).toLocaleString()+'円';

$('history').replaceChildren();

records.slice().reverse().forEach(r=>{

let p=document.createElement('p');

p.textContent=(r.date||'')+' '+r.race+'：'+(r.payout-r.cost).toLocaleString()+'円';

$('history').appendChild(p);

});

}

change('boat');

update();

</script>

</body>

</html>
<script>

const originalAnalyse = analyse;

analyse = async function(){

 const mode = sport;

 const day = $('date').value.replace(/-/g,'');

 const stadium = venues.boat.split(' ').indexOf($('venue').value)+1;

 const race = parseInt($('race').value);

 document.getElementById('extraV4')?.remove();

 await originalAnalyse();

 if(mode!=='boat'||sport!==mode)return;

 if($('date').value.replace(/-/g,'')!==day)return;

 if(venues.boat.split(' ').indexOf($('venue').value)+1!==stadium)return;

 if(parseInt($('race').value)!==race)return;

 const box=document.createElement('div');

 box.id='extraV4';

 box.className='card';

 box.textContent='展示・結果データ取得中...';

 $('details').parentElement.after(box);

 try{

 const url=`https://boatraceopenapi.github.io/api/v1/${day.slice(0,4)}/${day}.json`;

 const res=await fetch(url,{cache:'no-store'});

 if(!res.ok)throw new Error('HTTP '+res.status);

 const data=await res.json();

 const r=data.programs?.stadiums?.[stadium]?.races?.[race];

 if(!r)throw new Error('レース情報なし');

 const p=r.preview||{};

 const result=r.result||{};

 const value=(x)=>esc(x??'未取得');

 box.innerHTML=`

 <h3>直前情報・展示</h3>

 <table>

 <tr><td>天候</td><td>${value(p.weather_number_source)}</td></tr>

 <tr><td>風向</td><td>${value(p.wind_direction_number_source)}</td></tr>

 <tr><td>風速(m)</td><td>${value(p.wind_speed)}</td></tr>

 <tr><td>波高(cm)</td><td>${value(p.wave_height)}</td></tr>

 <tr><td>気温(℃)</td><td>${value(p.air_temperature)}</td></tr>

 <tr><td>水温(℃)</td><td>${value(p.water_temperature)}</td></tr>

 </table>

 <h3>展示成績</h3>

 <div class="scroll">

 <table>

 <tr><th>艇</th><th>進入</th><th>展示ST</th><th>タイム</th><th>チルト</th></tr>

 ${[1,2,3,4,5,6].map(n=>{

 const x=p.racers?.[n]||{};

 return `<tr>

 <td>${n}</td>

 <td>${value(x.course_number)}</td>

 <td>${value(x.start_timing_source??x.start_timing)}</td>

 <td>${value(x.exhibition_time)}</td>

 <td>${value(x.tilt_adjustment)}</td>

 </tr>`;

 }).join('')}

 </table>

 </div>

 <details>

 <summary>確定レース結果・払戻金</summary>

 <table>

 <tr><th>着順</th><th>艇</th><th>選手名</th></tr>

 ${Object.values(result.racers||{})

 .filter(x=>x.place_number>=1&&x.place_number<=6)

 .sort((a,b)=>a.place_number-b.place_number)

 .map(x=>`<tr><td>${value(x.place_number)}</td><td>${value(x.entry_number)}</td><td>${value(x.name)}</td></tr>`).join('')}

 </table>

 <h4>3連単</h4>

 ${showPayout(result.payouts?.trifecta)}

 <h4>3連複</h4>

 ${showPayout(result.payouts?.trio)}

 <p>備考：${value(result.remarks)}</p>

 <p>返還艇：${Array.isArray(result.refunds)?esc(result.refunds.join('・')||'なし'):'未取得'}</p>

 </details>

 <p class="warn">非公式データ・最新情報に遅れがある場合があります。</p>`;

 }catch(e){

 box.textContent='追加情報の取得失敗：'+e.message;

 }

};

function showPayout(items){

 if(!Array.isArray(items)||!items.length){

 return '<p>結果未取得</p>';

 }

 return items.map(x=>`<p>${esc(x.combination)}：${x.amount==null?esc(x.label??'未取得'):Number(x.amount).toLocaleString()+'円'}</p>`).join('');

}

document.querySelector('h1 small').textContent='V4';

document.title='AI RACE V4';

</script>
<script>

analyse = async function(){

 const mode=sport;

 const day=$('date').value.replace(/-/g,'');

 const stadium=venues.boat.split(' ').indexOf($('venue').value)+1;

 const race=parseInt($('race').value);

 document.getElementById('extraV4')?.remove();

 await originalAnalyse();

 if(mode!=='boat'||sport!==mode)return;

 if($('date').value.replace(/-/g,'')!==day)return;

 if(venues.boat.split(' ').indexOf($('venue').value)+1!==stadium)return;

 if(parseInt($('race').value)!==race)return;

 const box=document.createElement('div');

 box.id='extraV4';

 box.className='card';

 box.textContent='直前情報・結果取得中...';

 $('details').parentElement.after(box);

 const base='https://boatraceopenapi.github.io/';

 const path=day.slice(0,4)+'/'+day+'.json';

 async function get(path){

  try{

   const res=await fetch(base+path,{cache:'no-store'});

   if(!res.ok)return null;

   return await res.json();

  }catch(e){return null}

 }

 const [pd,rd]=await Promise.all([

 get('previews/v2/'+path),

 get('results/v3/'+path)

 ]);

 if(!box.isConnected)return;

 const p=pd?.previews?.find(x=>

 Number(x.race_stadium_number)===stadium&&

 Number(x.race_number)===race);

 const r=rd?.results?.find(x=>

 Number(x.stadium_number)===stadium&&

 Number(x.number)===race);

 const val=x=>esc(x??'未取得');

 function st(x){

  if(x==null)return '未取得';

  if(Number(x)<0)return 'F'+Math.abs(Number(x)).toFixed(2);

  return Number(x).toFixed(2);

 }

 function payout(items){

  if(!Array.isArray(items)||!items.length)

   return '<p>結果未取得</p>';

  return items.map(x=>'<p>'+val(x.combination)+'：'+val(x.amount==null?null:Number(x.amount).toLocaleString())+'円</p>').join('');

 }

 box.innerHTML=`

 <h3>直前情報・水面条件</h3>

 <p class="${p?'good':'warn'}">${p?'展示データ取得成功':'展示データ未取得'}</p>

 <table>

 <tr><td>天候コード</td><td>${val(p?.race_weather_number)}</td></tr>

 <tr><td>風向コード</td><td>${val(p?.race_wind_direction_number)}</td></tr>

 <tr><td>風速</td><td>${val(p?.race_wind)} m</td></tr>

 <tr><td>波高</td><td>${val(p?.race_wave)} cm</td></tr>

 <tr><td>気温</td><td>${val(p?.race_temperature)} ℃</td></tr>

 <tr><td>水温</td><td>${val(p?.race_water_temperature)} ℃</td></tr>

 </table>

 <h3>展示成績</h3>

 <div class="scroll">

 <table>

 <tr>

 <th>艇</th><th>進入</th><th>展示ST</th><th>タイム</th><th>チルト</th>

 </tr>

 ${[1,2,3,4,5,6].map(n=>{

 const x=p?.boats?.find(b=>Number(b.racer_boat_number)===n);

 return `<tr>

 <td><span class="num" style="background:${colors[n-1]};color:${[1,5].includes(n)?'#111':'white'}">${n}</span></td>

 <td>${val(x?.racer_course_number)}</td>

 <td>${st(x?.racer_start_timing)}</td>

 <td>${val(x?.racer_exhibition_time)}</td>

 <td>${val(x?.racer_tilt_adjustment)}</td>

 </tr>`;

 }).join('')}

 </table>

 </div>

 <details>

 <summary>確定レース結果・払戻金</summary>

 <p class="${r?'good':'warn'}">${r?'結果取得成功':'結果未取得'}</p>

 <table>

 <tr><th>着順</th><th>艇番</th><th>選手名</th></tr>

 ${(r?.boats||[]).slice().sort((a,b)=>

 Number(a.racer_place_number)-Number(b.racer_place_number)

 ).map(x=>`<tr>

 <td>${val(x.racer_place_number)}</td>

 <td>${val(x.racer_boat_number)}</td>

 <td>${val(x.racer_name)}</td>

 </tr>`).join('')}

 </table>

 <h4>3連単</h4>

 ${payout(r?.payouts?.trifecta)}

 <h4>3連複</h4>

 ${payout(r?.payouts?.trio)}

 <h4>2連単</h4>

 ${payout(r?.payouts?.exacta)}

 <h4>2連複</h4>

 ${payout(r?.payouts?.quinella)}

 <p>返還情報：未検証</p>

 </details>

 <p>出典：Boatrace Open API</p>

 <p class="warn">非公式データのため更新の遅れに注意してください。</p>`;

 const rows=$('factors').querySelectorAll('tr');

 rows.forEach(row=>{

 const name=row.cells[0]?.textContent;

 if(p&&(

 (name==='展示タイム'&&p.boats?.some(b=>b.racer_exhibition_time!=null))||

 (name==='風速・波高'&&p.race_wind!=null&&p.race_wave!=null)

 )){

 }

 });

};

<script>

const histCard=document.createElement('div');

histCard.className='card';

histCard.innerHTML=`

<h2>過去データ統計</h2>

<p>全国24場の競走結果を集計します。</p>

<label>開始日</label>

<input type="date" id="histFrom">

<label>終了日</label>

<input type="date" id="histTo">

<label>集計対象</label>

<select id="histVenue">

<option value="0">全国24場</option>

${venues.boat.split(' ').map((v,i)=>

'<option value="'+(i+1)+'">'+v+'</option>').join('')}

</select>

<button id="histRun" onclick="runHistory()">

過去データ集計開始

</button>

<p id="histStatus"></p>

<div id="histOutput"></div>

`;

$('result').before(histCard);

$('histFrom').value=$('date').value.slice(0,8)+'01';

const yesterday=new Date(Date.now()-86400000);

$('histTo').value=yesterday.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});

async function runHistory(){

 const from=new Date($('histFrom').value+'T00:00:00Z');

 const to=new Date($('histTo').value+'T00:00:00Z');

 const target=Number($('histVenue').value);

 const days=[];

 if(!Number.isFinite(+from)||!Number.isFinite(+to)||from>to){

 alert('日付を確認してください');return;

 }

 for(let d=new Date(from);d<=to;d.setUTCDate(d.getUTCDate()+1)){

 days.push(d.toISOString().slice(0,10).replace(/-/g,''));

 if(days.length>31){

 alert('一度に集計できるのは31日間です');return;

 }

 }

 $('histRun').disabled=true;

 $('histOutput').innerHTML='';

 const boats=Array.from({length:6},()=>[0,0,0]);

 const grades={A1:[0,0,0,0],A2:[0,0,0,0],B1:[0,0,0,0],B2:[0,0,0,0]};

 const players=new Map();

 let total=0,high50=0,high100=0,payCount=0,amountSum=0;

 let success=0,excluded=0;

 const failed=[];

 const base='https://boatraceopenapi.github.io/';

 async function get(url){

 try{

 const res=await fetch(url);

 if(!res.ok)return null;

 return await res.json();

 }catch(e){return null}

 }

 try{

 for(let i=0;i<days.length;i++){

 const day=days[i];

 const path=day.slice(0,4)+'/'+day+'.json';

 $('histStatus').textContent=

 '集計中：'+(i+1)+'/'+days.length+'日';

 const [rd,pd]=await Promise.all([

 get(base+'results/v3/'+path),

 get(base+'api/v1/'+path)

 ]);

 if(!Array.isArray(rd?.results)){

 failed.push(day);continue;

 }

 success++;

 for(const r of rd.results){

 if(target&&Number(r.stadium_number)!==target)continue;

 const racers=(r.boats||[]).filter(x=>

 Number(x.racer_place_number)>=1&&

 Number(x.racer_place_number)<=6&&

 Number(x.racer_boat_number)>=1&&

 Number(x.racer_boat_number)<=6);

 const top=racers.filter(x=>Number(x.racer_place_number)<=3);

 if(top.length!==3||new Set(top.map(x=>Number(x.racer_place_number))).size!==3){

 excluded++;continue;

 }

 total++;

 const payouts=r.payouts?.trifecta;

 if(Array.isArray(payouts)&&payouts.length===1&&

 payouts[0].amount!=null&&Number(payouts[0].amount)>0){

 const amount=Number(payouts[0].amount);

 payCount++;

 amountSum+=amount;

 if(amount>=5000)high50++;

 if(amount>=10000)high100++;

 }

 const program=pd?.programs?.stadiums?.[r.stadium_number]?.races?.[r.number];

 for(const x of racers){

 const n=Number(x.racer_boat_number);

 const place=Number(x.racer_place_number);

 if(place<=3)boats[n-1][place-1]++;

 const entry=program?.racers?.[n];

 const grade=entry?.rank_number_source;

 if(grades[grade]){

 grades[grade][0]++;

 if(place<=3)grades[grade][place]++;

 }

 const key=String(x.racer_number||'');

 if(!key)continue;

 if(!players.has(key)){

 players.set(key,{

 name:x.racer_name||entry?.name||key,

 count:0,

 places:[0,0,0],

 courses:Array.from({length:6},()=>[0,0,0,0])

 });

 }

 const p=players.get(key);

 p.count++;

 if(place<=3)p.places[place-1]++;

 const course=Number(x.racer_course_number);

 if(course>=1&&course<=6){

 p.courses[course-1][0]++;

 if(place<=3)p.courses[course-1][place]++;

 }

 }

 }

 }

 const pct=(n,d)=>d?(n/d*100).toFixed(1)+'%':'―';

 $('histStatus').textContent=

 '集計完了：'+total.toLocaleString()+

 'レース／取得'+success+'日';

 $('histOutput').innerHTML=`

 <p>集計対象：${total.toLocaleString()}レース</p>

 <p>除外：${excluded}レース</p>

 <p>取得失敗日：${failed.length?failed.join('、'):'なし'}</p>

 <h3>艇番別着順率</h3>

 <table>

 <tr><th>艇</th><th>1着</th><th>2着</th><th>3着</th><th>3着内</th></tr>

 ${boats.map((b,i)=>`

 <tr>

 <td><span class="num" style="background:${colors[i]};color:${i===0||i===4?'#111':'white'}">${i+1}</span></td>

 <td>${pct(b[0],total)}</td>

 <td>${pct(b[1],total)}</td>

 <td>${pct(b[2],total)}</td>

 <td>${pct(b.reduce((a,v)=>a+v,0),total)}</td>

 </tr>`).join('')}

 </table>

 <h3>級別着順率</h3>

 <table>

 <tr><th>級</th><th>出走</th><th>1着</th><th>2着</th><th>3着</th></tr>

 ${Object.entries(grades).map(([g,b])=>`

 <tr><td>${g}</td><td>${b[0]}</td>

 <td>${pct(b[1],b[0])}</td>

 <td>${pct(b[2],b[0])}</td>

 <td>${pct(b[3],b[0])}</td></tr>`).join('')}

 </table>

 <h3>3連単・配当統計</h3>

 <div class="stats">

 <div class="stat">50倍以上<strong>${pct(high50,payCount)}</strong></div>

 <div class="stat">万舟率<strong>${pct(high100,payCount)}</strong></div>

 <div class="stat">平均払戻金<strong>${payCount?Math.round(amountSum/payCount).toLocaleString():'―'}円</strong></div>

 <div class="stat">配当集計数<strong>${payCount}</strong></div>

 </div>

 <h3>選手別成績</h3>

 <input id="playerSearch" placeholder="選手名・登録番号を検索">

 <div id="playerList"></div>

 <p class="warn">返還・同着・不成立の完全な処理は未実装です。級別・選手別成績は有効着順を取得できた出走のみ集計しています。</p>

 `;

 function showPlayers(){

 const q=$('playerSearch').value.trim();

 const list=Array.from(players.entries()).filter(([k,p])=>

 q?(p.name.includes(q)||k.includes(q)):p.count>=10

 ).sort((a,b)=>b[1].places[0]/b[1].count-a[1].places[0]/a[1].count).slice(0,50);

 $('playerList').innerHTML=list.map(([k,p])=>`

 <details>

 <summary>${esc(p.name)}／1着率 ${pct(p.places[0],p.count)}</summary>

 <p>登録番号：${esc(k)}</p>

 <p>有効出走：${p.count}</p>

 <p>1着：${pct(p.places[0],p.count)}　

 2着：${pct(p.places[1],p.count)}　

 3着：${pct(p.places[2],p.count)}</p>

 <table>

 <tr><th>コース</th><th>出走</th><th>1着</th><th>2着</th><th>3着</th></tr>

 ${p.courses.map((c,i)=>`

 <tr><td>${i+1}</td><td>${c[0]}</td>

 <td>${pct(c[1],c[0])}</td>

 <td>${pct(c[2],c[0])}</td>

 <td>${pct(c[3],c[0])}</td></tr>`).join('')}

 </table>

 </details>`).join('')||'<p>該当選手なし</p>';

 }

 $('playerSearch').oninput=showPlayers;

 showPlayers();

 }catch(e){

 $('histStatus').textContent='集計エラー：'+e.message;

 }finally{

 $('histRun').disabled=false;

 }

}

document.title='AI RACE V5';

<script>

const v6=document.createElement('div');

v6.className='card';

v6.innerHTML=`

<h2>詳細統計・V6</h2>

<p>過去の実測データを端末に保存して分析します。</p>

<button id="v6load">指定期間のデータを保存・集計</button>

<button id="v6show">保存済みデータを表示</button>

<p id="v6status"></p>

<div id="v6out"></div>

`;

histCard.after(v6);

const v6key='aiRaceHistoryV6';

async function v6get(url){

 try{

 const r=await fetch(url);

 if(!r.ok)return null;

 return await r.json();

 }catch(e){return null}

}

async function v6collect(){

 const from=new Date($('histFrom').value+'T00:00:00Z');

 const to=new Date($('histTo').value+'T00:00:00Z');

 if(!Number.isFinite(+from)||!Number.isFinite(+to)||from>to){

 alert('集計期間を確認してください');

 return;

 }

 const days=[];

 for(let d=new Date(from);d<=to;d.setUTCDate(d.getUTCDate()+1)){

 days.push(d.toISOString().slice(0,10).replace(/-/g,''));

 if(days.length>31){

 alert('最大31日間です');return;

 }

 }

 $('v6load').disabled=true;

 const records=[];

 const failed=[];

 const base='https://boatraceopenapi.github.io/';

 try{

 for(let i=0;i<days.length;i++){

 const day=days[i];

 const path=day.slice(0,4)+'/'+day+'.json';

 $('v6status').textContent=

 '取得中 '+(i+1)+'/'+days.length+'日';

 const [rd,pd,ed]=await Promise.all([

 v6get(base+'results/v3/'+path),

 v6get(base+'api/v1/'+path),

 v6get(base+'previews/v2/'+path)

 ]);

 if(!Array.isArray(rd?.results)){

 failed.push(day);continue;

 }

 const previews=new Map(

 (ed?.previews||[]).map(p=>[

 p.race_stadium_number+'-'+p.race_number,p

 ]));

 for(const r of rd.results){

 const boats=r.boats||[];

 const top=boats.filter(b=>

 Number(b.racer_place_number)>=1&&

 Number(b.racer_place_number)<=3);

 if(top.length!==3||

 new Set(top.map(b=>Number(b.racer_place_number))).size!==3)

 continue;

 const prog=pd?.programs?.stadiums?.[r.stadium_number]?.races?.[r.number];

 const pre=previews.get(r.stadium_number+'-'+r.number);

 const payout=r.payouts?.trifecta;

 const pay=payout?.length===1?

 Number(payout[0].amount):null;

 records.push({

 d:day,

 s:Number(r.stadium_number),

 r:Number(r.number),

 w:pre?.race_wind??null,

 p:pay>0?pay:null,

 b:boats.map(b=>{

 const n=Number(b.racer_boat_number);

 const x=prog?.racers?.[n];

 const e=pre?.boats?.find(y=>

 Number(y.racer_boat_number)===n);

 return [

 n,

 Number(b.racer_place_number)||0,

 b.racer_number,

 x?.rank_number_source??null,

 e?.racer_exhibition_time??null,

 e?.racer_course_number??null

 ];

 })

 });

 }

 }

 const data={records,failed,days};

 try{

 localStorage.setItem(v6key,JSON.stringify(data));

 $('v6status').textContent=

 '保存成功：'+records.length.toLocaleString()+'レース';

 }catch(e){

 $('v6status').textContent=

 '端末保存失敗・今回の集計のみ表示';

 }

 v6render(data);

 }catch(e){

 $('v6status').textContent='取得エラー：'+e.message;

 }finally{

 $('v6load').disabled=false;

 }

}

function v6render(data){

 const target=Number($('histVenue').value);

 const rows=data.records.filter(r=>!target||r.s===target);

 const grades=['A1','A2','B1','B2'];

 const pct=(n,d)=>d?(100*n/d).toFixed(1)+'%':'―';

 let html='<p>対象：'+rows.length.toLocaleString()+

 'レース</p>';

 html+='<p>結果取得失敗日：'+

 esc(data.failed.join('、')||'なし')+'</p>';

 html+='<h3>艇番×級別の実測1着率</h3>';

 html+='<table><tr><th>艇</th>'+

 grades.map(g=>'<th>'+g+'</th>').join('')+'</tr>';

 for(let n=1;n<=6;n++){

 html+='<tr><td>'+n+'</td>';

 for(const g of grades){

 const a=rows.flatMap(r=>r.b.filter(b=>

 b[0]===n&&b[3]===g&&b[1]>=1&&b[1]<=6));

 html+='<td>'+pct(a.filter(b=>b[1]===1).length,a.length)+

 '<br><small>'+a.length+'走</small></td>';

 }

 html+='</tr>';

 }

 html+='</table>';

 html+='<h3>競艇場別の着順統計</h3>';

 html+='<table><tr><th>会場</th><th>件数</th><th>1号艇1着率</th></tr>';

 venues.boat.split(' ').forEach((name,i)=>{

 const a=rows.filter(r=>r.s===i+1);

 if(!a.length)return;

 const wins=a.filter(r=>r.b.some(b=>

 b[0]===1&&b[1]===1)).length;

 html+='<tr><td>'+name+'</td><td>'+

 a.length+'</td><td>'+pct(wins,a.length)+'</td></tr>';

 });

 html+='</table>';

 html+='<h3>風速別の実測統計</h3>';

 html+='<table><tr><th>風速</th><th>件数</th><th>1号艇1着率</th></tr>';

 const winds=[

 ['0〜1m',0,1],

 ['2〜3m',2,3],

 ['4〜5m',4,5],

 ['6m以上',6,100]

 ];

 for(const [label,min,max] of winds){

 const a=rows.filter(r=>r.w!=null&&

 r.b.some(b=>Number(b[4])>0)&&

 Number(r.w)>=min&&Number(r.w)<=max);

 const wins=a.filter(r=>r.b.some(b=>

 b[0]===1&&b[1]===1)).length;

 html+='<tr><td>'+label+'</td><td>'+

 a.length+'</td><td>'+pct(wins,a.length)+'</td></tr>';

 }

 html+='</table>';

 html+='<h3>展示順位別の実測成績</h3>';

 html+='<table><tr><th>展示順位</th><th>件数</th><th>1着率</th><th>3着内</th></tr>';

 const ex=Array.from({length:6},()=>[0,0,0]);

 for(const r of rows){

 const b=r.b.filter(x=>Number(x[4])>0);

 if(b.length!==6)continue;

 if(new Set(b.map(x=>Number(x[4]))).size!==6)continue;

 b.sort((a,c)=>Number(a[4])-Number(c[4]));

 b.forEach((x,i)=>{

 ex[i][0]++;

 if(x[1]===1)ex[i][1]++;

 if(x[1]>=1&&x[1]<=3)ex[i][2]++;

 });

 }

 ex.forEach((a,i)=>{

 html+='<tr><td>'+(i+1)+'</td><td>'+a[0]+

 '</td><td>'+pct(a[1],a[0])+

 '</td><td>'+pct(a[2],a[0])+'</td></tr>';

 });

 html+='</table>';

 html+='<p class="warn">過去の記述統計です。将来の的中確率ではありません。欠損・同着・返還等の処理には制限があります。</p>';

 $('v6out').innerHTML=html;

}

$('v6load').onclick=v6collect;

$('v6show').onclick=function(){

 try{

 const raw=localStorage.getItem(v6key);

 if(!raw){

 alert('保存済みデータがありません');return;

 }

 const data=JSON.parse(raw);

 v6render(data);

 $('v6status').textContent='保存済みデータを表示中';

 }catch(e){

 $('v6status').textContent='読み込み失敗';

 }

};

<script>

const v7=document.createElement('div');

v7.className='card';

v7.innerHTML=`

<h2>統計精度検証・V7</h2>

<p>保存済みの過去データを学習期間と検証期間に分けて比較します。</p>

<button id="v7run">統計精度を検証する</button>

<p id="v7status"></p>

<div id="v7out"></div>

`;

v6.after(v7);

$('v7run').onclick=function(){

 try{

 const data=JSON.parse(localStorage.getItem(v6key)||'null');

 if(!data?.records?.length){

 alert('V6でデータを保存してください');

 return;

 }

 const days=[...new Set(data.records.map(r=>r.d))].sort();

 if(days.length<5){

 alert('5日間以上のデータが必要です');

 return;

 }

 const split=Math.floor(days.length*0.8);

 const cutoff=days[split];

 const train=data.records.filter(r=>r.d<cutoff);

 const test=data.records.filter(r=>r.d>=cutoff);

 const pct=(n,d)=>d?(100*n/d).toFixed(1)+'%':'―';

 function stats(rows,n,g){

 const a=rows.flatMap(r=>r.b.filter(b=>

 b[0]===n&&b[3]===g&&b[1]>=1&&b[1]<=6));

 return {

 count:a.length,

 wins:a.filter(b=>b[1]===1).length,

 top3:a.filter(b=>b[1]<=3).length

 };

 }

 let html=`

 <h3>検証条件</h3>

 <table>

 <tr><td>学習開始日</td><td>${days[0]}</td></tr>

 <tr><td>学習終了日</td><td>${days[split-1]}</td></tr>

 <tr><td>学習レース数</td><td>${train.length}</td></tr>

 <tr><td>検証開始日</td><td>${cutoff}</td></tr>

 <tr><td>検証終了日</td><td>${days.at(-1)}</td></tr>

 <tr><td>検証レース数</td><td>${test.length}</td></tr>

 </table>

 <h3>艇番・級別の再現性</h3>

 <table>

 <tr>

 <th>艇</th><th>級</th>

 <th>学習1着率</th><th>検証1着率</th>

 <th>検証数</th>

 </tr>`;

 for(let n=1;n<=6;n++){

 for(const g of ['A1','A2','B1','B2']){

 const a=stats(train,n,g);

 const b=stats(test,n,g);

 html+=`<tr>

 <td>${n}</td>

 <td>${g}</td>

 <td>${pct(a.wins,a.count)}</td>

 <td>${pct(b.wins,b.count)}</td>

 <td>${b.count}</td>

 </tr>`;

 }

 }

 html+='</table>';

 html+=`<h3>配当発生率の比較</h3>

 <table>

 <tr><th>項目</th><th>学習期間</th><th>検証期間</th></tr>`;

 const ap=train.filter(r=>r.p>0);

 const bp=test.filter(r=>r.p>0);

 for(const [label,limit] of [

 ['50倍以上',5000],

 ['万舟券',10000]

 ]){

 html+=`<tr>

 <td>${label}</td>

 <td>${pct(ap.filter(r=>r.p>=limit).length,ap.length)}</td>

 <td>${pct(bp.filter(r=>r.p>=limit).length,bp.length)}</td>

 </tr>`;

 }

 html+='</table>';

 html+=`<p class="warn">

 過去の統計の再現性を確認する機能です。

 個別レースの予測精度や将来の利益を保証するものではありません。

 出走数が少ない条件には注意してください。

 </p>`;

 $('v7out').innerHTML=html;

 $('v7status').textContent='統計検証完了';

 }catch(e){

 $('v7status').textContent='検証失敗：'+e.message;

 }

};

document.title='AI RACE V7';

</script>
